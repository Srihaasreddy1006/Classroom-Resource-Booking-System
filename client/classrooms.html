<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classrooms Directory — Classroom Resource Booking System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div id="navbarMount"></div>

  <div class="page-header">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-8">
          <h2 class="fw-bold mb-1">Campus Classrooms & Facilities</h2>
          <p class="text-muted small mb-0">Browse and inspect availability across all 10 university lecture rooms, laboratories, and halls</p>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
          <a href="/booking.html" class="btn btn-primary">
            <i class="bi bi-calendar-plus me-1"></i>Book a Classroom
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="container pb-5">
    <!-- Filter and Search Bar -->
    <div class="custom-card p-3 mb-4">
      <div class="row g-2 align-items-center">
        <div class="col-md-4">
          <div class="input-group input-group-sm">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="searchInput" class="form-control" placeholder="Search by name, ID (e.g. CR-101), or building...">
          </div>
        </div>

        <div class="col-6 col-md-2">
          <select id="typeFilter" class="form-select form-select-sm">
            <option value="">All Room Types</option>
            <option value="Standard classroom">Standard classroom</option>
            <option value="Smart classroom">Smart classroom</option>
            <option value="Seminar hall">Seminar hall</option>
            <option value="Computer laboratory">Computer laboratory</option>
            <option value="Conference room">Conference room</option>
          </select>
        </div>

        <div class="col-6 col-md-2">
          <select id="buildingFilter" class="form-select form-select-sm">
            <option value="">All Buildings</option>
            <option value="Main Academic Block">Main Academic Block</option>
            <option value="Dr. APJ Abdul Kalam Auditorium Complex">Auditorium Complex</option>
            <option value="Turing Computing Centre">Turing Computing Centre</option>
            <option value="Administrative & Faculty Block">Administrative Block</option>
            <option value="Science & Humanities Block">Science & Humanities</option>
            <option value="Innovation & Incubation Centre">Innovation Centre</option>
          </select>
        </div>

        <div class="col-6 col-md-2">
          <select id="capacityFilter" class="form-select form-select-sm">
            <option value="">Min Capacity</option>
            <option value="30">30+ Seats</option>
            <option value="50">50+ Seats</option>
            <option value="75">75+ Seats</option>
            <option value="150">150+ Seats</option>
          </select>
        </div>

        <div class="col-6 col-md-2 d-flex gap-1">
          <button id="resetFiltersBtn" class="btn btn-sm btn-outline-secondary w-100">
            <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
          </button>
        </div>
      </div>
    </div>

    <!-- Classrooms Grid -->
    <div id="loadingClassrooms" class="spinner-container">
      <div class="spinner-border text-primary" role="status"></div>
      <div class="small mt-2">Loading classrooms directory...</div>
    </div>

    <div id="noResults" class="empty-state d-none">
      <i class="bi bi-search"></i>
      <h5>No matching classrooms found</h5>
      <p class="text-muted small">Try adjusting your search criteria or resetting filters.</p>
    </div>

    <div id="classroomsGrid" class="row g-4 d-none"></div>
  </div>

  <div id="footerMount"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let allClassrooms = [];

    function renderClassrooms(rooms) {
      const grid = document.getElementById('classroomsGrid');
      const noResults = document.getElementById('noResults');

      if (!rooms || rooms.length === 0) {
        grid.classList.add('d-none');
        noResults.classList.remove('d-none');
        return;
      }

      noResults.classList.add('d-none');
      grid.classList.remove('d-none');

      grid.innerHTML = rooms.map(room => {
        const facilitiesBadges = (room.facilities || []).slice(0, 3)
          .map(f => `<span class="badge bg-light text-dark border me-1 mb-1">${f}</span>`)
          .join('');

        return `
          <div class="col-md-6 col-lg-4">
            <div class="custom-card h-100 d-flex flex-column overflow-hidden">
              <div style="height: 180px; position: relative; background-color: #cbd5e1;">
                <img src="${room.imageUrl || 'https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=600'}" alt="${room.name}" style="width: 100%; height: 100%; object-fit: cover;">
                <span class="position-absolute top-0 end-0 m-2 badge ${room.status === 'active' ? 'bg-success' : 'bg-warning'} text-capitalize">
                  ${room.status}
                </span>
                <span class="position-absolute bottom-0 start-0 m-2 badge bg-dark bg-opacity-75 text-white font-monospace">
                  ${room.classroomId}
                </span>
              </div>
              <div class="p-4 d-flex flex-column flex-grow-1">
                <div class="d-flex justify-content-between align-items-start mb-1">
                  <h5 class="fw-bold mb-0">${room.name}</h5>
                  <span class="badge bg-primary text-white">${room.type}</span>
                </div>
                <div class="small text-muted mb-2">
                  <i class="bi bi-geo-alt me-1"></i>${room.building} • ${room.floor}
                </div>
                <p class="small text-muted flex-grow-1 mb-3">${room.description}</p>

                <div class="mb-3">
                  <div class="small fw-semibold text-muted mb-1">Key Facilities:</div>
                  <div class="d-flex flex-wrap">${facilitiesBadges}</div>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-3 border-top mt-auto">
                  <span class="badge bg-secondary text-white"><i class="bi bi-people-fill me-1"></i>${room.capacity} Capacity</span>
                  <div class="d-flex gap-1">
                    <a href="/classroom-details.html?id=${room._id}" class="btn btn-sm btn-outline-primary" title="View Schedule">
                      Details
                    </a>
                    <a href="/booking.html?roomId=${room._id}" class="btn btn-sm btn-primary">
                      Book Slot
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const type = document.getElementById('typeFilter').value;
      const building = document.getElementById('buildingFilter').value;
      const minCap = Number(document.getElementById('capacityFilter').value) || 0;

      const filtered = allClassrooms.filter(room => {
        const matchesSearch = !search ||
          room.name.toLowerCase().includes(search) ||
          room.classroomId.toLowerCase().includes(search) ||
          room.building.toLowerCase().includes(search) ||
          room.description.toLowerCase().includes(search);

        const matchesType = !type || room.type === type;
        const matchesBuilding = !building || room.building === building;
        const matchesCapacity = !minCap || room.capacity >= minCap;

        return matchesSearch && matchesType && matchesBuilding && matchesCapacity;
      });

      renderClassrooms(filtered);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      renderNavbar('classrooms');
      renderFooter();

      const res = await fetchApi('/classrooms');
      document.getElementById('loadingClassrooms').classList.add('d-none');

      if (res.success && res.data) {
        allClassrooms = res.data;
        renderClassrooms(allClassrooms);
      }

      document.getElementById('searchInput').addEventListener('input', applyFilters);
      document.getElementById('typeFilter').addEventListener('change', applyFilters);
      document.getElementById('buildingFilter').addEventListener('change', applyFilters);
      document.getElementById('capacityFilter').addEventListener('change', applyFilters);

      document.getElementById('resetFiltersBtn').addEventListener('click', () => {
        document.getElementById('searchInput').value = '';
        document.getElementById('typeFilter').value = '';
        document.getElementById('buildingFilter').value = '';
        document.getElementById('capacityFilter').value = '';
        renderClassrooms(allClassrooms);
      });
    });
  </script>
</body>
</html>
